version: "2"

linters:

  default: all

  disable:
    - wsl
    - wsl_v5
    - gomodguard
    - ireturn
    - nlreturn
    - nonamedreturns
    - exhaustruct
    - forbidigo
    - varnamelen
    - gochecknoglobals

    - revive
    - wrapcheck

  settings:

    depguard:
      rules:
        main:
          files:
            - $all
          allow:
            - $gostd
            - github.com/SaveTheRbtz/zstd-seekable-format-go/pkg
            - github.com/klauspost/compress/zstd
            - github.com/takanoriyanagitani/go-zstd-seekable2info
          deny:
            - pkg: unsafe

    nolintlint:
      require-specific: true
      require-explanation: true
      allow-unused: false
      allow-no-explanation:
        - funlen
        - ireturn
        - gocognit
        - cyclop
        - funlen

    govet:
      enable-all: true
      disable:
      - fieldalignment

    staticcheck:
      checks:
      - all
      - -ST1017
      - -ST1023
      - -QF1011
      - -QF1008
      - -ST1001
      - -ST1000
